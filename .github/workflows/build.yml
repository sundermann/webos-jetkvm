name: Build webOS JetKVM
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
      - run: npm ci --ignore-scripts
      - run: npm run quality:setup
      - run: npm run build
      - run: npm run format:check
      - run: npm run lint
      - name: Configure host regression tests
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build host regression tests
        run: cmake --build build/host --target settings-test annexb-test jetkvm-test lifecycle-test control-test --parallel 2
      - run: npm run lint:native
      - run: ctest --test-dir build/host --output-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quality-diagnostics
          path: build/validation/
  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            third_party/jetkvm/ui/package-lock.json
            patches/jetkvm/*.patch
      - name: Install Buildroot NC4 SDK
        working-directory: /opt
        run: |
          wget -q -O toolchain.tar.gz https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          echo '2230a6351e5cce6fcb9d4fdcb4697335f223995401ef969c81744aaeb14c5344  toolchain.tar.gz' | sha256sum -c -
          tar xf toolchain.tar.gz
          ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh
          echo '/opt/arm-webos-linux-gnueabi_sdk-buildroot/bin' >> "$GITHUB_PATH"
          echo 'CMAKE_TOOLCHAIN_FILE=/opt/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake' >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run quality:setup
      - run: npm run build
      - run: npm run build:native
      - run: python3 tools/quality.py tidy --build-dir build/release
      - run: npm run package
      - run: npm run manifest
      - uses: actions/upload-artifact@v4
        with:
          name: webos-jetkvm
          path: dist/*
